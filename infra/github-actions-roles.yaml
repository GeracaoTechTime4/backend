AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Roles que o GitHub Actions assume via OIDC (sem chaves de acesso) para fazer deploy
  da API (Lambda Web Functions) e do front (S3 + CloudFront) do shift-swap.

Parameters:
  # O GitHub usa o "sub" imutável, que inclui os IDs numéricos da organização e do repositório
  # (gh api repos/<org>/<repo>/actions/oidc/customization/sub mostra o prefixo).
  BackendSubPrefix:
    Type: String
    Default: repo:GeracaoTechTime4@330860588/backend@1376465255
  FrontendSubPrefix:
    Type: String
    Default: repo:GeracaoTechTime4@330860588/frontend@1376465593
  BackendBranch:
    Type: String
    Default: main
  FrontendBranch:
    Type: String
    Default: developer
  FunctionName:
    Type: String
    Default: shift-swap-api
  ApiCodeBucket:
    Type: String
    Default: shift-swap-api-web-666600766236
  FrontendBucket:
    Type: String
    Default: shift-swap-frontend-666600766236

Resources:
  # O provedor OIDC do GitHub (token.actions.githubusercontent.com) já existe na conta.
  BackendDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-actions-shift-swap-backend
      Description: Deploy da API pelo GitHub Actions (só a branch de deploy do backend)
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub ${BackendSubPrefix}:ref:refs/heads/${BackendBranch}
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:GetWebFunction
                  - lambda:GetWebFunctionEndpoint
                  - lambda:ListWebFunctionEndpoints
                  - lambda:GetWebFunctionRevision
                  - lambda:ListWebFunctionRevisions
                  - lambda:CreateWebFunctionRevision
                Resource:
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:web-function/${FunctionName}
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:web-function/${FunctionName}/*
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub arn:aws:s3:::${ApiCodeBucket}/*
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/${FunctionName}-web-role
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com

  FrontendDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-actions-shift-swap-frontend
      Description: Deploy do front pelo GitHub Actions (só a branch de deploy do frontend)
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub ${FrontendSubPrefix}:ref:refs/heads/${FrontendBranch}
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:aws:s3:::${FrontendBucket}
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:aws:s3:::${FrontendBucket}/*

Outputs:
  BackendDeployRoleArn:
    Value: !GetAtt BackendDeployRole.Arn
  FrontendDeployRoleArn:
    Value: !GetAtt FrontendDeployRole.Arn
