name: Deploy

# Publica o bundle já testado (artefato `lambda-bundle` do job de CI) num ambiente.
# - ci-cd.yml chama para staging, com o bundle da própria execução.
# - promote.yml chama para production, com o bundle e o commit de uma execução que já foi para
#   staging. Assim prod recebe exatamente o zip que foi testado em staging.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment (staging, production)
        required: true
        type: string
      config:
        description: Configuração do ambiente (config/env/<ambiente>.json)
        required: true
        type: string
      run_id:
        description: Execução de onde vem o artefato lambda-bundle (vazio = esta execução)
        required: false
        type: string
        default: ""
      ref:
        description: Commit a usar no checkout (migrations e config); vazio = o da execução
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  deploy:
    name: Deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.config.outputs.public_url }}
    # Canary de até 10 minutos + smoke tests + espera pelas métricas.
    timeout-minutes: 40
    concurrency:
      group: deploy-backend-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      AWS_REGION: us-east-1
      DEPLOY_CONFIG: ${{ inputs.config }}
      # Secret do Environment: URL direta (sem -pooler) do banco DESTE ambiente.
      MIGRATIONS_DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: lambda-bundle
          path: deploy/
          run-id: ${{ inputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Ler a configuração do ambiente
        id: config
        run: |
          {
            echo "FUNCTION_NAME=$(jq -r .functionName "$DEPLOY_CONFIG")"
            echo "ENDPOINT_NAME=$(jq -r .endpointName "$DEPLOY_CONFIG")"
            echo "CODE_BUCKET=$(jq -r .codeBucket "$DEPLOY_CONFIG")"
            echo "PUBLIC_URL=$(jq -r .publicUrl "$DEPLOY_CONFIG")"
            echo "DEPLOY_ROLE_ARN=$(jq -r .deployRoleArn "$DEPLOY_CONFIG")"
            # Parâmetro do SSM que a stack do CDK lê para os pesos do endpoint.
            echo "LIVE_REVISION_PARAM=$(jq -r .liveRevisionParameter "$DEPLOY_CONFIG")"
            echo "TEST_ENDPOINT_NAME=$(jq -r .testEndpointName "$DEPLOY_CONFIG")"
            echo "ALARMS=$(jq -r '.alarms | join(" ")' "$DEPLOY_CONFIG")"
            echo "SSM_PREFIX=$(jq -r .serviceConfig.environmentVariables.SSM_PREFIX "$DEPLOY_CONFIG")"
            echo "APP_ENV=$(jq -r .serviceConfig.environmentVariables.APP_ENV "$DEPLOY_CONFIG")"
            echo "CANARY_WEIGHT=$(jq -r .canary.weight "$DEPLOY_CONFIG")"
            echo "CANARY_MINUTES=$(jq -r .canary.minutes "$DEPLOY_CONFIG")"
            echo "CANARY_MIN_REQUESTS=$(jq -r .canary.minRequests "$DEPLOY_CONFIG")"
            echo "CANARY_MAX_ERROR_RATE=$(jq -r .canary.maxErrorRatePercent "$DEPLOY_CONFIG")"
            echo "CANARY_MAX_P95_MS=$(jq -r .canary.maxP95Ms "$DEPLOY_CONFIG")"
          } >> "$GITHUB_ENV"
          echo "public_url=$(jq -r .publicUrl "$DEPLOY_CONFIG")" >> "$GITHUB_OUTPUT"
          jq .serviceConfig "$DEPLOY_CONFIG" > service-config.json

      - uses: oven-sh/setup-bun@v2
        if: env.MIGRATIONS_DATABASE_URL != ''
      - name: Migrations
        if: env.MIGRATIONS_DATABASE_URL != ''
        run: bun install --frozen-lockfile && bun run migrate
        env:
          DATABASE_URL: ${{ env.MIGRATIONS_DATABASE_URL }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # O comando `aws lambda-web` só existe em versões recentes do AWS CLI.
      - name: Atualizar AWS CLI
        run: |
          curl -sSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o awscliv2.zip
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          aws lambda-web help > /dev/null

      - name: Enviar código para o S3
        id: upload
        run: |
          (cd deploy && zip -qX ../function.zip index.js package.json)
          # Hash do bundle (e não do zip, que grava a data dos arquivos): igual em staging e produção
          # quando a promoção publica o mesmo artefato.
          echo "sha256 do bundle (index.js): $(sha256sum deploy/index.js | cut -d' ' -f1)"
          VERSION_ID=$(aws s3api put-object --bucket "$CODE_BUCKET" --key "$FUNCTION_NAME/function.zip" \
            --body function.zip --query VersionId --output text)
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"

      # A configuração (role, env vars, timeout, logs) vem de $DEPLOY_CONFIG, não da revisão anterior.
      # APP_VERSION identifica a revisão nas métricas EMF (src/lib/metricas.ts): commit + execução,
      # para que dois deploys do mesmo commit não se misturem no canary.
      - name: Criar revisão
        id: revision
        env:
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
          COMMIT: ${{ inputs.ref || github.sha }}
        run: |
          # Com dois pesos (um canary interrompido), a revisão atual é a de maior peso.
          CURRENT=$(aws lambda-web get-web-function-endpoint --function-name "$FUNCTION_NAME" \
            --endpoint-name "$ENDPOINT_NAME" --query 'max_by(revisionWeights, &weight).revisionId' --output text)
          echo "Revisão atual: $CURRENT"
          echo "previous=$CURRENT" >> "$GITHUB_OUTPUT"

          APP_VERSION="${COMMIT::7}-${GITHUB_RUN_ID}"
          jq --arg v "$APP_VERSION" '.environmentVariables.APP_VERSION = $v' service-config.json > sc.json
          mv sc.json service-config.json
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

          jq -n --arg b "$CODE_BUCKET" --arg k "$FUNCTION_NAME/function.zip" --arg v "$VERSION_ID" \
            '{codeConfig: {s3Object: {bucket: $b, key: $k, versionId: $v}}, runtimeConfig: {runtime: "nodejs24.x"}}' \
            > build-config.json

          NEW=$(aws lambda-web create-web-function-revision --function-name "$FUNCTION_NAME" \
            --build-config file://build-config.json --service-config file://service-config.json \
            --description "${COMMIT::7}" --query revisionId --output text)
          echo "Nova revisão: $NEW (APP_VERSION=$APP_VERSION)"
          echo "id=$NEW" >> "$GITHUB_OUTPUT"

      - name: Esperar a revisão ficar ativa
        env:
          NEW: ${{ steps.revision.outputs.id }}
        run: |
          for i in $(seq 1 60); do
            STATE=$(aws lambda-web get-web-function-revision --function-name "$FUNCTION_NAME" \
              --revision-id "$NEW" --query state --output text)
            [ "$STATE" = "Active" ] && exit 0
            if [ "$STATE" = "Failed" ]; then
              aws lambda-web get-web-function-revision --function-name "$FUNCTION_NAME" \
                --revision-id "$NEW" --query stateReason --output text
              exit 1
            fi
            sleep 5
          done
          echo "::error::Timeout esperando a revisão $NEW ficar ativa"
          exit 1

      # Uma revisão que falha ao iniciar também fica Active: só uma requisição real confirma que ela
      # funciona. O endpoint de teste não recebe tráfego de usuários, então uma revisão quebrada para
      # aqui sem afetar ninguém.
      - name: Smoke test no endpoint de teste
        env:
          NEW: ${{ steps.revision.outputs.id }}
        run: |
          .github/scripts/pesos.sh "$TEST_ENDPOINT_NAME" "$NEW=100"

          DOMAIN=$(aws lambda-web get-web-function-endpoint --function-name "$FUNCTION_NAME" \
            --endpoint-name "$TEST_ENDPOINT_NAME" --query domainName --output text)
          SECRET=$(aws ssm get-parameter --name "${SSM_PREFIX}ORIGIN_SECRET" --query Parameter.Value --output text)
          echo "::add-mask::$SECRET"

          status() { curl -s -o /dev/null -w '%{http_code}' --max-time 15 -H "x-origin-verify: $SECRET" "https://$DOMAIN$1"; }
          for i in $(seq 1 12); do
            H=$(status /health); T=$(status /turnos); S=$(status /api/auth/get-session)
            echo "health=$H turnos=$T get-session=$S"
            [ "$H" = 200 ] && [ "$T" = 401 ] && [ "$S" = 200 ] && exit 0
            sleep 5
          done
          echo "::error::A revisão $NEW não respondeu como esperado no endpoint de teste. Nenhum tráfego foi movido."
          exit 1

      # Canary: CANARY_WEIGHT% do tráfego para a revisão nova por CANARY_MINUTES minutos. Durante esse
      # tempo o job gera tráfego pelo CloudFront (o volume real é baixo, principalmente em staging) e
      # acompanha os alarmes do ambiente. No fim, as métricas da própria revisão (EMF, por APP_VERSION)
      # precisam cumprir os limites de config/env/<ambiente>.json. Qualquer falha volta o tráfego.
      - name: Canary
        id: canary
        env:
          NEW: ${{ steps.revision.outputs.id }}
          PREVIOUS: ${{ steps.revision.outputs.previous }}
          APP_VERSION: ${{ steps.revision.outputs.app_version }}
        run: |
          em_alarme() {
            aws cloudwatch describe-alarms --alarm-names $ALARMS --state-value ALARM \
              --query 'MetricAlarms[].AlarmName' --output text
          }

          ATIVOS=$(em_alarme)
          if [ -n "$ATIVOS" ]; then
            echo "::error::Alarme já disparado antes do canary: $ATIVOS. Resolva antes de publicar."
            exit 1
          fi

          .github/scripts/pesos.sh "$ENDPOINT_NAME" "$PREVIOUS=$((100 - CANARY_WEIGHT))" "$NEW=$CANARY_WEIGHT"
          START=$(date -u +%s)
          END=$((START + CANARY_MINUTES * 60))

          (
            while [ "$(date -u +%s)" -lt "$END" ]; do
              for p in health turnos api/auth/get-session; do
                curl -s -o /dev/null --max-time 10 "$PUBLIC_URL/api/$p" || true
              done
              sleep 1
            done
          ) &
          TRAFEGO=$!
          trap 'kill $TRAFEGO 2>/dev/null || true' EXIT

          # Até o fim do canary e mais 2 minutos: as métricas chegam ao CloudWatch com atraso.
          while [ "$(date -u +%s)" -lt $((END + 120)) ]; do
            sleep 30
            ATIVOS=$(em_alarme)
            if [ -n "$ATIVOS" ]; then
              echo "::error::Alarme disparado durante o canary: $ATIVOS"
              exit 1
            fi
          done

          # Um período só, do início do canary até agora (múltiplo de 60 s).
          PERIOD=$(( ( $(date -u +%s) - START + 119 ) / 60 * 60 ))
          dims="[{\"Name\":\"Environment\",\"Value\":\"$APP_ENV\"},{\"Name\":\"Version\",\"Value\":\"$APP_VERSION\"}]"
          query() { echo "{\"Id\":\"$1\",\"MetricStat\":{\"Metric\":{\"Namespace\":\"ShiftSwap/Api\",\"MetricName\":\"$2\",\"Dimensions\":$dims},\"Period\":$PERIOD,\"Stat\":\"$3\"}}"; }
          echo "[$(query req Requests Sum),$(query err Errors5xx Sum),$(query p95 Latency p95)]" > queries.json
          aws cloudwatch get-metric-data --metric-data-queries file://queries.json \
            --start-time "$(date -u -d "@$START" +%FT%TZ)" --end-time "$(date -u +%FT%TZ)" > metricas.json

          # Se vierem dois pontos (período cortado no meio), soma as contagens e fica com o maior p95.
          REQ=$(jq '[.MetricDataResults[] | select(.Id=="req") | .Values[]] | add // 0' metricas.json)
          ERR=$(jq '[.MetricDataResults[] | select(.Id=="err") | .Values[]] | add // 0' metricas.json)
          P95=$(jq '[.MetricDataResults[] | select(.Id=="p95") | .Values[]] | max // 0' metricas.json)
          echo "Revisão $NEW ($APP_VERSION): $REQ requisições, $ERR com 5xx, p95 $P95 ms"
          {
            echo "### Canary ($CANARY_WEIGHT% por $CANARY_MINUTES min)"
            echo "| Requisições | 5xx | p95 |"
            echo "|---|---|---|"
            echo "| $REQ (mín. $CANARY_MIN_REQUESTS) | $ERR (máx. $CANARY_MAX_ERROR_RATE%) | $P95 ms (máx. $CANARY_MAX_P95_MS) |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Poucas requisições com métrica = a revisão não está respondendo (ou nem chega a iniciar).
          jq -en --argjson r "$REQ" --argjson m "$CANARY_MIN_REQUESTS" '$r >= $m' > /dev/null \
            || { echo "::error::A revisão nova registrou só $REQ requisições (mínimo $CANARY_MIN_REQUESTS)."; exit 1; }
          jq -en --argjson e "$ERR" --argjson r "$REQ" --argjson m "$CANARY_MAX_ERROR_RATE" '100 * $e / $r <= $m' > /dev/null \
            || { echo "::error::Taxa de 5xx da revisão nova acima de $CANARY_MAX_ERROR_RATE%."; exit 1; }
          jq -en --argjson p "$P95" --argjson m "$CANARY_MAX_P95_MS" '$p <= $m' > /dev/null \
            || { echo "::error::Latência p95 da revisão nova acima de $CANARY_MAX_P95_MS ms."; exit 1; }

      - name: Mover todo o tráfego para a revisão nova
        env:
          NEW: ${{ steps.revision.outputs.id }}
        run: .github/scripts/pesos.sh "$ENDPOINT_NAME" "$NEW=100"

      - name: Smoke test pelo domínio público
        run: |
          for i in $(seq 1 12); do
            if curl -sf "$PUBLIC_URL/api/health"; then
              test "$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/api/turnos")" = "401" && exit 0
            fi
            sleep 5
          done
          echo "::error::A API não respondeu como esperado após o deploy."
          exit 1

      # A stack do CDK lê este parâmetro para os pesos do endpoint: sem ele, o próximo `cdk deploy`
      # que mexesse no endpoint mandaria o tráfego de volta para a revisão anterior. Só é gravado com
      # a revisão nova em 100%.
      - name: Registrar a revisão no ar
        env:
          NEW: ${{ steps.revision.outputs.id }}
        run: |
          aws ssm put-parameter --name "$LIVE_REVISION_PARAM" --type String --value "$NEW" --overwrite > /dev/null
          echo "$LIVE_REVISION_PARAM = $NEW"

      # Qualquer falha (ou cancelamento/timeout) a partir do canary volta tudo para a anterior. A
      # condição usa o resultado do passo, e não uma saída dele: num cancelamento as saídas podem se
      # perder. Se o canary falhou antes de mover os pesos, o rollback só reaplica o que já estava.
      - name: Rollback
        if: (failure() || cancelled()) && steps.canary.outcome != 'skipped' && steps.canary.outcome != ''
        env:
          PREVIOUS: ${{ steps.revision.outputs.previous }}
        run: |
          echo "::warning::Voltando o tráfego para $PREVIOUS"
          .github/scripts/pesos.sh "$ENDPOINT_NAME" "$PREVIOUS=100"
          aws ssm put-parameter --name "$LIVE_REVISION_PARAM" --type String --value "$PREVIOUS" --overwrite > /dev/null
