name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Typecheck, build e smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shift_swap
          POSTGRES_PASSWORD: shift_swap
          POSTGRES_DB: shift_swap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shift_swap -d shift_swap"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://shift_swap:shift_swap@localhost:5432/shift_swap
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run build

      # Roda o bundle de produção no Node 24 (como no Lambda) contra um Postgres de verdade.
      - name: Smoke test do bundle
        run: |
          bun run migrate
          AWS_LAMBDA_HTTP_ENDPOINT=127.0.0.1:3000 node deploy/index.js > server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:3000/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/turnos)" = "401"
      # Sem DATABASE_URL/BETTER_AUTH_SECRET o bundle (sempre produção) não pode subir.
      - name: Bundle recusa configuração inválida
        run: |
          if env -u DATABASE_URL -u BETTER_AUTH_SECRET node deploy/index.js > invalid.log 2>&1; then
            echo "::error::O bundle subiu sem DATABASE_URL e BETTER_AUTH_SECRET" && exit 1
          fi
          grep -q "Configuração inválida" invalid.log && grep -q "DATABASE_URL" invalid.log && grep -q "BETTER_AUTH_SECRET" invalid.log

      - name: Configuração dos ambientes
        run: |
          for f in config/env/*.json; do
            jq -e '.functionName and .endpointName and .codeBucket and .publicUrl and .deployRoleArn
              and .serviceConfig.executionRoleArn
              and .serviceConfig.environmentVariables.NODE_ENV == "production"
              and .serviceConfig.environmentVariables.SSM_PREFIX
              and .serviceConfig.environmentVariables.BETTER_AUTH_URL
              and .serviceConfig.environmentVariables.CORS_ORIGIN' "$f" > /dev/null \
              || { echo "::error file=$f::configuração incompleta"; exit 1; }
          done

      - name: Log do servidor
        if: failure()
        run: cat server.log || true

      - uses: actions/upload-artifact@v4
        with:
          name: lambda-bundle
          path: deploy/
          retention-days: 30

  # Merge na main: publica em staging. Prod sai pelo workflow "Promover para produção"
  # (promote.yml), que publica o mesmo bundle de uma execução que já passou por staging.
  staging:
    name: Staging
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
      actions: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      config: config/env/staging.json
    secrets: inherit
