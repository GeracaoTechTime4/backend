name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::666600766236:role/github-actions-shift-swap-backend
  FUNCTION_NAME: shift-swap-api
  ENDPOINT_NAME: default
  CODE_BUCKET: shift-swap-api-web-666600766236
  PUBLIC_URL: https://dkrzib6ua831y.cloudfront.net

jobs:
  ci:
    name: Typecheck, build e smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shift_swap
          POSTGRES_PASSWORD: shift_swap
          POSTGRES_DB: shift_swap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shift_swap -d shift_swap"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://shift_swap:shift_swap@localhost:5432/shift_swap
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run build

      # Roda o bundle de produção no Node 24 (como no Lambda) contra um Postgres de verdade.
      - name: Smoke test do bundle
        run: |
          bun run migrate
          AWS_LAMBDA_HTTP_ENDPOINT=127.0.0.1:3000 node deploy/index.js > server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:3000/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/turnos)" = "401"
      - name: Log do servidor
        if: failure()
        run: cat server.log || true

      - uses: actions/upload-artifact@v4
        with:
          name: lambda-bundle
          path: deploy/
          retention-days: 7

  deploy:
    name: Deploy no Lambda Web Functions
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    env:
      # Opcional: URL direta (sem -pooler) do Neon. Se o secret existir, as migrations rodam antes do deploy.
      MIGRATIONS_DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lambda-bundle
          path: deploy/

      - uses: oven-sh/setup-bun@v2
        if: env.MIGRATIONS_DATABASE_URL != ''
      - name: Migrations
        if: env.MIGRATIONS_DATABASE_URL != ''
        run: bun install --frozen-lockfile && bun run migrate
        env:
          DATABASE_URL: ${{ env.MIGRATIONS_DATABASE_URL }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # O comando `aws lambda-web` só existe em versões recentes do AWS CLI.
      - name: Atualizar AWS CLI
        run: |
          curl -sSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o awscliv2.zip
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          aws lambda-web help > /dev/null

      - name: Enviar código para o S3
        id: upload
        run: |
          (cd deploy && zip -q ../function.zip index.js package.json)
          VERSION_ID=$(aws s3api put-object --bucket "$CODE_BUCKET" --key "$FUNCTION_NAME/function.zip" \
            --body function.zip --query VersionId --output text)
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"

      # Copia a configuração (role, env vars, timeout, logs) da revisão que está no ar e troca só o código.
      - name: Criar revisão
        id: revision
        env:
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
        run: |
          CURRENT=$(aws lambda-web get-web-function-endpoint --function-name "$FUNCTION_NAME" \
            --endpoint-name "$ENDPOINT_NAME" --query 'revisionWeights[0].revisionId' --output text)
          echo "Revisão atual: $CURRENT"
          echo "previous=$CURRENT" >> "$GITHUB_OUTPUT"

          aws lambda-web get-web-function-revision --function-name "$FUNCTION_NAME" --revision-id "$CURRENT" \
            --query serviceConfig --output json > service-config.json

          jq -n --arg b "$CODE_BUCKET" --arg k "$FUNCTION_NAME/function.zip" --arg v "$VERSION_ID" \
            '{codeConfig: {s3Object: {bucket: $b, key: $k, versionId: $v}}, runtimeConfig: {runtime: "nodejs24.x"}}' \
            > build-config.json

          NEW=$(aws lambda-web create-web-function-revision --function-name "$FUNCTION_NAME" \
            --build-config file://build-config.json --service-config file://service-config.json \
            --description "${GITHUB_SHA::7}" --query revisionId --output text)
          echo "Nova revisão: $NEW"
          echo "id=$NEW" >> "$GITHUB_OUTPUT"

      - name: Aguardar a revisão assumir o tráfego
        env:
          NEW: ${{ steps.revision.outputs.id }}
        run: |
          for i in $(seq 1 60); do
            WEIGHT=$(aws lambda-web get-web-function-endpoint --function-name "$FUNCTION_NAME" \
              --endpoint-name "$ENDPOINT_NAME" \
              --query "revisionWeights[?revisionId=='$NEW'].weight | [0]" --output text)
            [ "$WEIGHT" = "100" ] && echo "Revisão $NEW no ar" && exit 0
            sleep 10
          done
          echo "Timeout esperando a revisão $NEW" && exit 1

      # Uma revisão que falha ao iniciar também fica Active: só uma requisição real confirma o deploy.
      - name: Smoke test em produção
        run: |
          for i in $(seq 1 12); do
            if curl -sf "$PUBLIC_URL/api/health"; then
              test "$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/api/turnos")" = "401" && exit 0
            fi
            sleep 5
          done
          echo "::error::A API não respondeu como esperado após o deploy."
          echo "Para voltar à revisão anterior (${{ steps.revision.outputs.previous }}), veja a seção de rollback no README."
          exit 1
